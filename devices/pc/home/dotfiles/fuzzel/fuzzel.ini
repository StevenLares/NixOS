
[main]
dpi-aware=yes
match-mode=fuzzy

# Keep layer as default (overlay), since it seems that the lockscreen problem has been resolved.
# If not, change it
# https://codeberg.org/dnkl/fuzzel/issues/81

# last 2 digits are opacity. Recall that 80 is 50% and ff is 100% in hexadecimal
[colors]
background=94090d80
text=ffffffff
prompt=ffffffff
input=ffffffff
match=d23600ff
selection=ffffffff
selection-text=000000ff
selection-match=d23600ff
